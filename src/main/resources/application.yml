spring:
  application:
    name: soundhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soundhub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}   # cada um pode trocar pela variavel de ambiente DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: validate   # quem cria/altera tabela e o Flyway, nunca o Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # chave em Base64 (minimo 256 bits). Em producao, sobrescrever com a variavel JWT_SECRET
  secret: ${JWT_SECRET:c291bmRodWItY2hhdmUtc2VjcmV0YS1kZS1kZXNlbnZvbHZpbWVudG8tbWluaW1vLTI1Ni1iaXRzLW9r}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.soundhub: DEBUG
